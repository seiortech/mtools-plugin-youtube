name: Build Plugin

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a GitHub Release with built bundles and SHA256SUMS.txt"
        required: false
        type: boolean
        default: false
      release_tag:
        description: "GitHub Release tag (e.g. v1.0.0). Required when publish_release is true."
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release inputs
        run: |
          if [ "${{ inputs.publish_release }}" = "true" ] && [ -z "${{ inputs.release_tag }}" ]; then
            echo "::error::release_tag is required when publish_release is true"
            exit 1
          fi

  build:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            platform: darwin-arm64
          - goos: darwin
            goarch: amd64
            platform: darwin-amd64
          - goos: linux
            goarch: amd64
            platform: linux-amd64
          - goos: linux
            goarch: arm64
            platform: linux-arm64
          - goos: windows
            goarch: amd64
            platform: windows-amd64
          - goos: windows
            goarch: arm64
            platform: windows-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build sidecar binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist/bin dist/bundles
          go build -trimpath -ldflags="-s -w" -o dist/bin/tool .

      - name: Install mtools-plugin CLI
        run: go install github.com/seiortech/mtools-sdk/cmd/mtools-plugin@v0.1.2

      - name: Pack and verify signed bundle
        env:
          MTOOLS_PLUGIN_PRIV_KEY: ${{ secrets.MTOOLS_PLUGIN_PRIV_KEY }}
        run: |
          if [ -z "${MTOOLS_PLUGIN_PRIV_KEY:-}" ]; then
            echo "::error::MTOOLS_PLUGIN_PRIV_KEY secret is not set"
            exit 1
          fi
          printf '%s\n' "$MTOOLS_PLUGIN_PRIV_KEY" > /tmp/mtools_key.priv
          chmod 600 /tmp/mtools_key.priv
          mtools-plugin pack \
            -manifest manifest.json \
            -surfaces surfaces.json \
            -bin dist/bin/tool \
            -platform "${{ matrix.platform }}" \
            -key /tmp/mtools_key.priv \
            -out "dist/bundles/com.mtools.youtube-${{ matrix.platform }}.zip"
          mtools-plugin verify \
            -bundle "dist/bundles/com.mtools.youtube-${{ matrix.platform }}.zip" \
            -platform "${{ matrix.platform }}"

      - name: Clean up signing key
        if: always()
        run: rm -f /tmp/mtools_key.priv

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          path: dist/bundles/*.zip

  release:
    needs: build
    if: inputs.publish_release == true && inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          merge-multiple: true
          path: dist/bundles

      - name: Generate SHA256SUMS
        run: |
          cd dist/bundles
          sha256sum *.zip > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: dist/bundles/*
